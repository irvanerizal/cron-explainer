<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cron Explainer — cron expression to human readable & next run times</title>
  <meta name="description" content="Free cron expression explainer: translate any cron schedule into plain English and preview the next run times. 100% client-side." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Cron Explainer</h1>
      <span class="badge">100% client-side</span>
    </div>
    <button id="btn-theme" class="ghost icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </header>

  <main>
    <section class="expr-row">
      <input id="expr" class="expr-input" spellcheck="false" autocomplete="off" value="*/15 * * * *" aria-label="Cron expression" />
    </section>

    <div id="error" class="error hidden"></div>

    <div class="presets" id="presets">
      <button class="chip" data-expr="* * * * *">Every minute</button>
      <button class="chip" data-expr="*/5 * * * *">Every 5 min</button>
      <button class="chip" data-expr="0 * * * *">Every hour</button>
      <button class="chip" data-expr="30 14 * * *">Daily 14:30</button>
      <button class="chip" data-expr="0 9 * * 1-5">Weekdays 09:00</button>
      <button class="chip" data-expr="0 0 * * 0">Sundays</button>
      <button class="chip" data-expr="0 0 1 * *">First of month</button>
      <button class="chip" data-expr="@daily">@daily</button>
    </div>

    <div class="builder" id="builder">
      <div class="field-card"><label for="f-minute">Minute</label><input id="f-minute" spellcheck="false" autocomplete="off" /></div>
      <div class="field-card"><label for="f-hour">Hour</label><input id="f-hour" spellcheck="false" autocomplete="off" /></div>
      <div class="field-card"><label for="f-dom">Day</label><input id="f-dom" spellcheck="false" autocomplete="off" /></div>
      <div class="field-card"><label for="f-month">Month</label><input id="f-month" spellcheck="false" autocomplete="off" /></div>
      <div class="field-card"><label for="f-dow">Weekday</label><input id="f-dow" spellcheck="false" autocomplete="off" /></div>
    </div>

    <div class="cards">
      <div class="card">
        <h2>Explanation</h2>
        <p id="explain"></p>
      </div>
      <div class="card">
        <h2>Next runs <span class="muted-note">local time</span></h2>
        <ul id="next-runs"></ul>
      </div>
    </div>

    <footer class="statusbar">
      <span id="status">Standard 5-field cron: minute hour day month weekday — names (MON, JAN) and @aliases supported</span>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
